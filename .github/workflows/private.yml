name: Private freshness witness
run-name: Freshness for ${{ github.repository }}@${{ inputs.tag }}

# This workflow is called from a customer's private repository. GitHub runs it
# in the caller's repository context, so github.token is scoped to that repo and
# actions/attest stores the resulting bundle in that repo's private attestation
# store. No GitHub credential is passed by Tinfoil to this workflow.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to witness."
        required: true
        type: string
      digest:
        description: "Release artifact SHA-256 digest."
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: tinfoil-freshness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  witness:
    name: witness (${{ github.repository }})
    runs-on: ubuntu-latest
    steps:
      - name: Authorize control-plane dispatch
        env:
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$ACTOR_ID" != "195980381" || "$TRIGGERING_ACTOR" != "tinfoil[bot]" ]]; then
            echo "freshness may only be dispatched by the Tinfoil GitHub App" >&2
            exit 1
          fi

      - uses: tinfoilsh/freshness-witness@main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repo: ${{ github.repository }}
          tag: ${{ inputs.tag }}
          digest: ${{ inputs.digest }}
