name: Freshness
run-name: Freshness ${{ inputs.request_id || github.run_id }}

# The control plane owns scheduling because GitHub disables repository
# schedules after 60 days without activity.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Enclave repository to witness (owner/name)."
        required: true
      request_id:
        description: "Controlplane dispatch correlation ID."
        required: false

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  witness:
    name: witness (${{ inputs.repo }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Ensure GitHub CLI supports attestations
        run: |
          version=$(gh --version | head -n1 | awk '{print $3}')
          required=2.67.0
          if [ "$(printf '%s\n' "$required" "$version" | sort -V | head -n1)" != "$required" ]; then
            echo "GitHub CLI ${version} is older than required ${required}" >&2
            exit 1
          fi

      - name: Verify release and build predicate
        id: predicate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
        run: ./scripts/check-and-attest.sh "$REPO"

      - name: Attest freshness witness
        uses: actions/attest@67422f5511b7ff725f4dbd6fb9bd2cd925c65a8d  # v1.4.1
        with:
          subject-name: ${{ steps.predicate.outputs.subject_name }}
          subject-digest: ${{ steps.predicate.outputs.subject_digest }}
          predicate-type: https://tinfoil.sh/predicate/freshness-witness/v1
          predicate-path: predicate.json
