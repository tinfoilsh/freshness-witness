name: Freshness
run-name: Freshness for ${{ inputs.repo }}

# The control plane owns discovery, scheduling, and retries. This trusted
# workflow owns only latest-release resolution and publication.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Enclave repository to witness (owner/name)."
        required: true
permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  witness:
    name: witness (${{ inputs.repo }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Resolve repository identity
        id: repository
        env:
          REPO: ${{ inputs.repo }}
        run: |
          if ! [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid repository name: $REPO" >&2
            exit 1
          fi
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint repository read token
        id: repo-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.CONTROLPLANE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTROLPLANE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.repository.outputs.owner }}
          repositories: ${{ steps.repository.outputs.name }}
          permission-contents: read

      - name: Resolve latest release
        id: predicate
        env:
          GH_TOKEN: ${{ steps.repo-token.outputs.token || github.token }}
          REPO: ${{ inputs.repo }}
        run: ./scripts/check-and-attest.sh "$REPO"

      - name: Attest freshness witness
        uses: actions/attest@67422f5511b7ff725f4dbd6fb9bd2cd925c65a8d  # v1.4.1
        with:
          subject-name: ${{ steps.predicate.outputs.subject_name }}
          subject-digest: ${{ steps.predicate.outputs.subject_digest }}
          predicate-type: https://tinfoil.sh/predicate/freshness-witness/v1
          predicate-path: predicate.json
