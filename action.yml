name: Publish freshness witness
description: Publish the exact release endorsement selected by the control plane.
inputs:
  repo:
    description: Repository to witness (owner/name).
    required: true
  tag:
    description: Release tag to witness.
    required: true
  digest:
    description: Release artifact SHA-256 digest.
    required: true
runs:
  using: composite
  steps:
    - name: Build predicate
      id: predicate
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
        DIGEST: ${{ inputs.digest }}
      run: '"$GITHUB_ACTION_PATH/scripts/check-and-attest.sh" "$REPO" "$TAG" "$DIGEST"'

    - name: Attest freshness witness
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.0.0
      with:
        subject-name: ${{ steps.predicate.outputs.subject_name }}
        subject-digest: ${{ steps.predicate.outputs.subject_digest }}
        predicate-type: https://tinfoil.sh/predicate/freshness-witness/v1
        predicate-path: predicate.json
